name: Simple Python CI

on: [push]

jobs:
   build:
    runs-on :ubuntu-latest

    steps:
      -name: Checkout code
       uses: action/checkout@v3

      -name: Set up python
       uses: action/setup-python@v4
       with:
        python-version: "3.9"

      -name: Install dependencies
       run: pip install --upgrade pip

      -name: Run script
       run: python hello.py

